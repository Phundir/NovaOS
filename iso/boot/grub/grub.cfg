# One second: the menu of spec 2.2 stays on screen and any arrow key
# holds it; five seconds were five seconds of every boot.
set timeout=1
set default=0

set menu_color_normal=light-gray/black
set menu_color_highlight=black/light-green

# 1.7.1 — démarrage normal
menuentry "Nova OS" {
    echo "Chargement du kernel Nova OS..."
    multiboot2 /boot/nova-os.bin mode=normal
    boot
}

# 1.7.2 — mode recovery (spec 2.2)
# Cible : kernel + fs.dsa + shell CLI uniquement, aucun service secondaire,
# pas de compositeur graphique. Les services arriveront en phase 6.5.
menuentry "Nova OS — Mode recovery" {
    echo "Demarrage en mode recovery (services minimaux)..."
    multiboot2 /boot/nova-os.bin mode=recovery
    boot
}

# 1.7.3 — mode debug
# Journalisation verbeuse sur la console serie COM1.
menuentry "Nova OS — Mode debug" {
    echo "Demarrage en mode debug (traces verbeuses sur COM1)..."
    serial --unit=0 --speed=38400
    terminal_output --append serial
    multiboot2 /boot/nova-os.bin mode=debug verbose=1
    boot
}

# 13.11.3 — essai du delai de garde GPU
# Un dessin tient le GPU de l'hote au-dela des 2 s du noyau : le contexte
# doit etre perdu a 2 s, le compositeur continuer. Emprunte le GPU de
# l'hote quelques secondes : jamais au demarrage ordinaire.
menuentry "Nova OS — Essai du delai de garde GPU" {
    multiboot2 /boot/nova-os.bin mode=normal essai-gpu=garde
    boot
}

# 1.7.4 — version precedente (placeholder)
# Le rollback reel (double partition, spec 11.3) arrive en phase 8.5.
# On se contente ici de charger un binaire alternatif s'il existe.
menuentry "Nova OS — Version precedente" {
    if [ -f /boot/nova-os-prev.bin ]; then
        echo "Chargement de la version precedente..."
        multiboot2 /boot/nova-os-prev.bin mode=normal rollback=1
        boot
    else
        echo ""
        echo "Aucune version precedente disponible."
        echo "Le systeme de rollback sera implemente en phase 8.5."
        echo ""
        echo "Appuyez sur une touche pour revenir au menu."
        read dummy
    fi
}
