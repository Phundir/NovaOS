# Pinned nightly: the kernel uses unstable features (build-std, a JSON
# target, abi_x86_interrupt) that a later nightly may rename or reject.
# The release workflow and the developer's machine build with the same
# compiler; moving the date is a deliberate change, tested like any other
# (DECISIONS.md, "La toolchain est epinglee").
[toolchain]
channel = "nightly-2026-10-28"
components = ["rust-src", "llvm-tools-preview"]
targets = ["x86_64-unknown-none"]
profile = "minimal"
