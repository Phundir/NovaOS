# ALSA on Nova OS: one card, the mixer of the kernel, reached by the
# "nova" plugin through /dev/nova-audio (tools/ports/alsa-nova). The
# plugin converts itself (float or s16, mono or stereo, any rate): no
# "plug" layer, whose rate converter refused half the latencies asked.
pcm_type.nova {
    lib "/usr/lib/alsa-lib/libasound_module_pcm_nova.so"
}
pcm.nova {
    type nova
}
pcm.!default {
    type nova
}
