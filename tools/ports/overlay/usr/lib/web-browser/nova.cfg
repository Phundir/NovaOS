// Web Browser for Nova OS -- defaults of the Nova edition.
// (The first line of an AutoConfig file is ignored.)
const START = "file:///usr/lib/web-browser/nova/start.html";

// The Nova interface: userChrome.css of the profile, over the dark theme.
defaultPref("toolkit.legacyUserProfileCustomizations.stylesheets", true);
defaultPref("extensions.activeThemeID", "firefox-compact-dark@mozilla.org");
defaultPref("browser.theme.toolbar-theme", 0);
defaultPref("browser.uidensity", 1);
defaultPref("browser.tabs.inTitlebar", 0);
defaultPref("browser.toolbars.bookmarks.visibility", "never");

// Start page and new tab.
defaultPref("browser.startup.homepage", START);
defaultPref("browser.startup.page", 1);
defaultPref("browser.newtabpage.enabled", true);
try {
  const { AboutNewTab } = ChromeUtils.importESModule("resource:///modules/AboutNewTab.sys.mjs");
  AboutNewTab.newTabURL = START;
} catch (e) {}

// French, as the rest of Nova (language pack of distribution/extensions;
// an unofficial build accepts it without Mozilla's signature check).
defaultPref("intl.locale.requested", "fr,en-US");
defaultPref("xpinstall.signatures.required", false);
defaultPref("extensions.autoDisableScopes", 0);
defaultPref("intl.accept_languages", "fr-FR, fr, en-US, en");

// DuckDuckGo, the search engine of Nova's own browser.
defaultPref("browser.search.defaultenginename", "DuckDuckGo");

// No first-run tour, no telemetry, no background services that would
// talk to Mozilla from a system that does not ask for them.
defaultPref("browser.aboutwelcome.enabled", false);
defaultPref("startup.homepage_welcome_url", "");
defaultPref("startup.homepage_welcome_url.additional", "");
defaultPref("browser.startup.homepage_override.mstone", "ignore");
defaultPref("datareporting.policy.dataSubmissionEnabled", false);
defaultPref("datareporting.healthreport.uploadEnabled", false);
defaultPref("toolkit.telemetry.enabled", false);
defaultPref("app.normandy.enabled", false);
defaultPref("app.shield.optoutstudies.enabled", false);
defaultPref("browser.shell.checkDefaultBrowser", false);
defaultPref("extensions.pocket.enabled", false);
defaultPref("browser.newtabpage.activity-stream.feeds.topsites", false);
defaultPref("browser.newtabpage.activity-stream.feeds.section.topstories", false);

// Nova has no GPU: WebRender in software, no hardware video.
defaultPref("gfx.webrender.software", true);
defaultPref("media.hardware-video-decoding.enabled", false);

// Speed. A process costs about a second to start on Nova (a few dozen
// libraries mapped, a JavaScript runtime initialised) and the browser
// has two cores of its own (spec 7.2: a .cus runs on the upper half).
// Site isolation (Fission) starts a process per site: every search that
// leads to another site waited for one. Without it, pages share a small
// pool of content processes kept warm, one of them started in advance.
defaultPref("fission.autostart", false);
defaultPref("dom.ipc.processCount", 4);
defaultPref("dom.ipc.processPrelaunch.enabled", true);
// Local pages (file://) in the web content processes rather than in a
// process of their own: the first file page after a web page, or the
// reverse, waited for a process to start -- 600 to 800 ms measured, for a
// page that then loads in 60. The content sandbox that this separation
// backs is off on Nova (MOZ_DISABLE_CONTENT_SANDBOX).
defaultPref("browser.tabs.remote.separateFileUriProcess", false);
// Connections: the kernel's TCP table is shared by the whole system
// (net::tcp, 256 entries). Firefox's own ceiling (900) would let it take
// every entry and leave no connection to anything else; 128 is still far
// more than a session of browsing holds open.
defaultPref("network.http.max-connections", 128);
// Background services that fetch from Mozilla at every start and take
// the cores from the first page: experiments, remote settings of the
// new-tab page, region lookup, connectivity and captive portal probes.
defaultPref("messaging-system.rsexperimentloader.enabled", false);
defaultPref("nimbus.rollouts.enabled", false);
defaultPref("browser.region.update.enabled", false);
defaultPref("browser.region.network.url", "");
defaultPref("network.connectivity-service.enabled", false);
defaultPref("network.captive-portal-service.enabled", false);
defaultPref("browser.newtabpage.activity-stream.feeds.system.topstories", false);
defaultPref("browser.newtabpage.activity-stream.feeds.snippets", false);
defaultPref("browser.newtabpage.activity-stream.showSponsored", false);
defaultPref("browser.newtabpage.activity-stream.showSponsoredTopSites", false);
defaultPref("browser.newtabpage.activity-stream.telemetry", false);
defaultPref("browser.discovery.enabled", false);
defaultPref("extensions.getAddons.cache.enabled", false);
defaultPref("extensions.systemAddon.update.enabled", false);
defaultPref("browser.search.update", false);
// The profile lives in memory (tmpfs): no point writing the session
// every fifteen seconds.
defaultPref("browser.sessionstore.interval", 60000);

// Sound: ALSA, whose "default" device is Nova's mixer (/etc/asound.conf,
// plugin tools/ports/alsa-nova). cubeb would try PulseAudio only, which
// Nova does not have.
defaultPref("media.cubeb.backend", "alsa");
// The content process opens the sound device itself. AudioIPC relays it
// to the parent for the sake of a sandbox Nova does not have (the content
// sandbox is off: MOZ_DISABLE_CONTENT_SANDBOX), and the relayed stream
// never started.
defaultPref("media.cubeb.sandbox", false);

// Image build (tools/ports/webroot.sh): the browser is started once on
// the host, in the image's own root, to make the profile every Nova
// session then starts from -- first-run work (databases, language pack
// install, startup cache) done once instead of at every boot. With
// NOVA_PREPARE_PROFILE set, it quits cleanly once started; the startup
// cache is written at that quit.
try {
  if (Services.env.get("NOVA_PREPARE_PROFILE")) {
    Services.obs.addObserver(() => {
      globalThis.novaQuitTimer = Cc["@mozilla.org/timer;1"].createInstance(Ci.nsITimer);
      globalThis.novaQuitTimer.initWithCallback(
        () => Services.startup.quit(Ci.nsIAppStartup.eAttemptQuit), 8000, Ci.nsITimer.TYPE_ONE_SHOT);
    }, "browser-delayed-startup-finished");
  }
} catch (e) {}
