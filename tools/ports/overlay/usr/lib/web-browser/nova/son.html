<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Essai du son</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f1115; color: #e6e9ef; font-family: sans-serif; }
  button { width: 100%; height: 100%; font-size: 32px; background: #0f1115; color: #4ea1ff; border: 0; cursor: pointer; }
</style></head>
<body>
<!-- Sound check of the Nova edition: a click anywhere plays a 440 Hz tone
     for three seconds (a click, because the browser refuses to play sound
     that no gesture asked for). -->
<button id="b">Cliquer pour entendre un la (440 Hz, 3 s)</button>
<script>
document.getElementById("b").onclick = () => {
  const ctx = new AudioContext();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  gain.gain.value = 0.3;
  osc.frequency.value = 440;
  osc.connect(gain).connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + 3);
  document.title = "Son joue a " + ctx.sampleRate + " Hz";
};
</script>
</body></html>
