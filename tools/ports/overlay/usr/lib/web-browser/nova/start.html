<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Nouvel onglet</title>
<style>
  :root { --bg:#101218; --surface:#1c2028; --alt:#262b35; --accent:#4a9eff; --text:#e6e9ef; --dim:#8a92a3; --border:#3a414e; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:sans-serif; }
  main { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100%; gap:28px; }
  h1 { margin:0; font-weight:300; font-size:44px; letter-spacing:2px; }
  h1 b { color:var(--accent); font-weight:600; }
  #clock { color:var(--dim); font-size:15px; margin-top:-18px; }
  form { width:min(620px, 88vw); }
  input { width:100%; box-sizing:border-box; padding:14px 20px; font-size:17px; border-radius:26px;
          border:1px solid var(--border); background:var(--surface); color:var(--text); outline:none; }
  input:focus { border-color:var(--accent); }
  .tiles { display:grid; grid-template-columns:repeat(4, 130px); gap:14px; }
  .tiles a { display:flex; flex-direction:column; align-items:center; gap:8px; padding:16px 8px; border-radius:12px;
             background:var(--surface); color:var(--text); text-decoration:none; font-size:13px; border:1px solid transparent; }
  .tiles a:hover { border-color:var(--accent); background:var(--alt); }
  .tiles span { width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center;
                font-weight:600; font-size:18px; background:var(--alt); color:var(--accent); }
  footer { color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<main>
  <h1>Nova <b>Web</b></h1>
  <div id="clock"></div>
  <form action="https://html.duckduckgo.com/html/" method="get">
    <input name="q" placeholder="Rechercher sur le Web ou saisir une adresse" autofocus autocomplete="off">
  </form>
  <nav class="tiles">
    <a href="https://fr.wikipedia.org/"><span>W</span>Wikipedia</a>
    <a href="https://html.duckduckgo.com/html/"><span>D</span>DuckDuckGo</a>
    <a href="https://example.com/"><span>E</span>Example</a>
    <a href="https://developer.mozilla.org/fr/"><span>M</span>MDN</a>
  </nav>
  <footer>Web Browser pour Nova OS - moteur Gecko</footer>
</main>
<script>
  const clock = document.getElementById("clock");
  const tick = () => { clock.textContent = new Date().toLocaleString("fr-FR", { dateStyle: "full", timeStyle: "short" }); };
  tick(); setInterval(tick, 10000);
  // A typed address goes to the address, anything else to the search.
  document.querySelector("form").addEventListener("submit", (e) => {
    const q = e.target.q.value.trim();
    if (/^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(q) || /^https?:\/\//.test(q)) {
      e.preventDefault();
      location.href = /^https?:\/\//.test(q) ? q : "https://" + q;
    }
  });
</script>
</body>
</html>
